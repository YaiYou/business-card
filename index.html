<html>
    <head>
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="card">
            <img class="avatar" src="images/james.jpg">
            <div >
                <h3>James Sanders</h3>
                <p>Founder</p>
                <p>Music Teacher</p>
                <p>Frontend Developer</p>
                <h4>Brisbane, Australia</h4>
            </div>
        </div>

        <div class="timer">
            <svg class="timer-ring" width="200" height="200" viewBox="0 0 200 200">
                <circle class="timer-ring-track" cx="100" cy="100" r="90" />
                <circle class="timer-ring-progress" cx="100" cy="100" r="90" />
            </svg>
            <div class="timer-display">0</div>
            <button class="timer-button" type="button">Start 10s countdown</button>
        </div>

        <script src="timer.js"></script>
    </body>
</html>
